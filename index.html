<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AdminEdu</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--g:#047857;--gd:#064e3b;--gold:#c9a227;--bg:#f6f4ec;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:#1f2937}
h1,h2,h3,.ser{font-family:Lora,Georgia,serif}
.inp{width:100%;border:1px solid #d6d3c4;border-radius:8px;padding:.5rem .7rem;background:#fff;font-weight:400}
label .inp{margin-top:.25rem}
.inp:focus,button:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.btn{background:var(--g);color:#fff;border-radius:8px;padding:.5rem 1rem;font-weight:600;transition:background .2s}
.btn:hover{background:var(--gd)}
.btn2{background:#fff;border:1px solid var(--g);color:var(--g);border-radius:8px;padding:.45rem .9rem;font-weight:600;transition:background .2s}
.btn2:hover{background:#ecfdf5}
.card{background:#fff;border-radius:14px;border:1px solid #e7e3d0}
.pat{background-color:#064e3b;background-image:linear-gradient(45deg,rgba(201,162,39,.14) 25%,transparent 25%,transparent 75%,rgba(201,162,39,.14) 75%),linear-gradient(45deg,rgba(201,162,39,.14) 25%,transparent 25%,transparent 75%,rgba(201,162,39,.14) 75%);background-size:56px 56px;background-position:0 0,28px 28px}
.nv.on{background:rgba(201,162,39,.25);color:#f3d97a}
@keyframes pg{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.pg{animation:pg .3s ease}
@media(prefers-reduced-motion:reduce){.pg{animation:none}}
.doc table{border-collapse:collapse;width:100%}.doc .dt td,.doc .dt th{border:1px solid #000;padding:4px 6px;text-align:left}
@media print{aside,header,.np{display:none!important}main{padding:0!important}body.pv #app{display:none!important}#pv{position:static!important;background:none!important;padding:0!important}}
</style></head>
<body><div id="app"></div>
<div id="toast" class="fixed bottom-4 left-1/2 -translate-x-1/2 bg-emerald-900 text-white px-4 py-2 rounded-lg shadow-lg text-sm opacity-0 pointer-events-none transition-opacity z-50"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TA='2026/2027',KLS=[1,2,3,4,5,6].map(n=>'Kelas '+n),HARI=['Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'],ST=['Hadir','Sakit','Izin','Alpa'];
const BLN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const MENU=[['home','🏠','Beranda'],['bio','👤','Biodata Guru'],['nilai','📖','Nilai-Nilai Dasar'],['siswa','🎓','Data Diri Siswa'],['ortu','👪','Data Orang Tua'],['jadwal','🗓️','Jadwal Pelajaran'],['piket','🧹','Jadwal Piket'],['absen','✅','Daftar Hadir'],['rekap','📊','Rekap Absen'],['proyek','📁','Proyek Saya'],['kop','🏛️','Kop & Tanda Tangan'],['bak','💾','Cadangan Data'],['user','🔑','Kelola Akun',1],['akun','⚙️','Pengaturan Akun']];
const DEFS={
siswa:{t:'Data Diri Siswa',req:'nama',f:[['ta','Tahun Ajaran','ta'],['kelas','Kelas','kelas'],['nisn','NISN'],['nama','Nama Siswa'],['jk','Jenis Kelamin','sel',['Laki-laki','Perempuan']],['ttl','Tempat, Tanggal Lahir']]},
ortu:{t:'Data Orang Tua Siswa',req:'nama',f:[['ta','Tahun Ajaran','ta'],['kelas','Kelas','kelas'],['nama','Nama Siswa','sis'],['ayah','Nama Ayah'],['ibu','Nama Ibu'],['hp','Kontak HP'],['alamat','Alamat']]},
jadwal:{t:'Jadwal Mata Pelajaran',f:[['ta','Tahun Ajaran','ta'],['kelas','Kelas','kelas'],...HARI.map(h=>[h,h,'multi','Tambah mata pelajaran'])]},
piket:{t:'Jadwal Piket Kelas',f:[['ta','Tahun Ajaran','ta'],['kelas','Kelas','kelas'],...HARI.map(h=>[h,h,'multi','Tambah nama siswa'])]}};
const BIO=[['nama','Nama Lengkap'],['nip','NIP'],['nuptk','NUPTK'],['ttl','Tempat, Tanggal Lahir'],['pend','Pendidikan Terakhir'],['jab','Jabatan Guru'],['gol','Pangkat/Golongan'],['kelas','Tugas Mengajar Kelas']];
const NILAI=[['Pancasila','1. Ketuhanan Yang Maha Esa.\n2. Kemanusiaan yang adil dan beradab.\n3. Persatuan Indonesia.\n4. Kerakyatan yang dipimpin oleh hikmat kebijaksanaan dalam permusyawaratan/perwakilan.\n5. Keadilan sosial bagi seluruh rakyat Indonesia.'],
['Kode Etik Guru','Guru beriman dan bertakwa, serta menjadi teladan akhlak bagi peserta didik.\nGuru bersikap adil, jujur, dan tidak diskriminatif kepada seluruh peserta didik.\nGuru menjaga kerahasiaan data pribadi peserta didik dan sejawat.\nGuru terus meningkatkan kompetensi profesional dan pedagogik.\nGuru menjalin kerja sama yang baik dengan orang tua, rekan kerja, dan masyarakat.'],
['Ikrar Guru','Kami guru madrasah berikrar:\nSetia mengabdi kepada agama, bangsa, dan negara.\nMendidik dengan ikhlas, sabar, dan penuh kasih sayang.\nMenjunjung tinggi martabat profesi guru.\nMengutamakan kepentingan peserta didik di atas kepentingan pribadi.'],
['Tata Tertib Guru','Hadir 15 menit sebelum jam pelajaran pertama dimulai.\nBerpakaian rapi, sopan, dan sesuai ketentuan madrasah.\nMengisi jurnal mengajar dan daftar hadir siswa setiap hari.\nMemberi tahu madrasah lebih dulu jika berhalangan hadir.\nMenjaga kebersihan, ketertiban, dan sarana madrasah.']];
let db,me=null,page='home',tab='admin',ed={},ab={ta:TA,kelas:KLS[0],tgl:new Date().toLocaleDateString('sv')},rk={ta:TA,kelas:KLS[0],sem:'Ganjil'};
const SEED={users:[{u:'admin',p:'ee7bca5f63d914028a499b59cd262dcaf3bbd2cdb8ce943558ac0639b8face9b',h:1,nama:'Administrator',role:'admin',status:'aktif'},{u:'guru',p:'4ed561ec72234bb89c88ece04e5f2b839c27e49d1d9b395c14ef8ec8249fb9b5',h:1,nama:'Ustadz Ahmad',role:'guru',status:'aktif'}],
siswa:[['1234567001','Aisyah Nur Hidayah','Perempuan','Makassar, 12 Mei 2019'],['1234567002','Muhammad Faris','Laki-laki','Gowa, 3 Februari 2019'],['1234567003','Siti Khadijah','Perempuan','Maros, 21 Agustus 2019'],['1234567004','Umar Abdullah','Laki-laki','Makassar, 9 Januari 2019']].map(a=>({ta:TA,kelas:'Kelas 1',nisn:a[0],nama:a[1],jk:a[2],ttl:a[3]})),
ortu:[],jadwal:[],piket:[],absen:{},guru:{},info:['Pembagian jadwal semester ganjil sudah tersedia di menu Jadwal Pelajaran.','Guru wajib mengisi daftar hadir siswa sebelum jam kedua.']};
function load(){try{db=JSON.parse(localStorage.getItem('adminedu'))}catch(e){db=null}if(!db)db=JSON.parse(JSON.stringify(SEED));db.proyek=db.proyek||[];db.set=Object.assign({kode:true},db.set||{});db.kop=Object.assign({kem:'KEMENTERIAN AGAMA REPUBLIK INDONESIA',nama:'NAMA MADRASAH',alamat:'Alamat madrasah',kontak:'Telepon / email',kota:'Makassar',kepala:'',nipk:'',wali:'',nipw:'',logo:'',mode:'manual',img:''},db.kop||{})}
function local(){try{localStorage.setItem('adminedu',JSON.stringify(db))}catch(e){}}
function save(){local();fbQueue()}
function toast(m){const t=$('#toast');t.textContent=m;t.style.opacity=1;clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.opacity=0,m.length>50?5000:2200)}
function setMsg(t,ok){const m=$('#msg');m.className='text-sm mt-3 '+(ok?'text-emerald-700':'text-red-600');m.innerHTML=t}
const sel=(k,a,v)=>`<select id="f_${k}" class="inp">${a.map(x=>`<option ${x==v?'selected':''}>${esc(x)}</option>`).join('')}</select>`;
const chips=(k,v)=>String(v||'').split('; ').filter(Boolean).map((x,i)=>`<span class="inline-flex items-center gap-1 bg-emerald-50 text-emerald-900 rounded-full pl-3 pr-1 py-0.5">${esc(x)}<button type="button" class="w-5 h-5 rounded-full hover:bg-emerald-200" aria-label="Hapus ${esc(x)}" onclick="delChip('${k}',${i})">×</button></span>`).join('');
function addChip(k){const n=$('#n_'+k),h=$('#f_'+k),a=h.value?h.value.split('; '):[],v=n.value.trim().replace(/;/g,',');if(v){a.push(v);h.value=a.join('; ');$('#ch_'+k).innerHTML=chips(k,h.value)}n.value='';if(v)n.focus()}
function delChip(k,i){const h=$('#f_'+k),a=h.value.split('; ').filter(Boolean);a.splice(i,1);h.value=a.join('; ');$('#ch_'+k).innerHTML=chips(k,h.value)}
function fld(f,v){const[k,l,t,o]=f;let i;
if(t=='multi')return `<div class="block text-sm font-medium">${l}<div id="ch_${k}" class="flex flex-wrap gap-1 my-1">${chips(k,v)}</div><div class="flex gap-1"><input id="n_${k}" class="inp" placeholder="${o}" onkeydown="if(event.key==='Enter'){event.preventDefault();addChip('${k}')}"><button type="button" class="btn2 shrink-0" onclick="addChip('${k}')">Tambah</button></div><input type="hidden" id="f_${k}" value="${esc(v||'')}"></div>`;
if(t=='kelas')i=sel(k,KLS,v);else if(t=='sel')i=sel(k,o,v);else if(t=='sis')i=sel(k,db.siswa.map(s=>s.nama),v);
else i=`<input id="f_${k}" class="inp" value="${esc(v||(t=='ta'?TA:''))}">`;
return `<label class="block text-sm font-medium">${l}${i}</label>`}
const val=k=>($('#f_'+k)||{}).value||'';

/* ---------- AUTH ---------- */
function authView(){
const T=[['admin','Admin'],['guru','Guru'],['daftar','Daftar'],['verif','Verifikasi']];
let body='';
if(tab=='admin'||tab=='guru')body=`<label class="block text-sm font-medium">Nama pengguna<input id="lu" class="inp" autocomplete="username"></label><label class="block text-sm font-medium mt-3">Kata sandi<input id="lp" type="password" class="inp" autocomplete="current-password"></label><button class="btn w-full mt-4" onclick="doLogin('${tab}')">Masuk sebagai ${tab=='admin'?'Admin':'Guru'}</button>`;
else if(tab=='daftar')body=`<div class="space-y-3"><label class="block text-sm font-medium">Nama lengkap<input id="rn" class="inp"></label><label class="block text-sm font-medium">Nama pengguna<input id="ru" class="inp"></label><label class="block text-sm font-medium">Kata sandi (min. 6 karakter)<input id="rp" type="password" class="inp"></label><p class="text-xs text-gray-500">Pendaftaran baru berlaku sebagai akun Guru. Akun admin hanya dibuat oleh admin.</p></div><button class="btn w-full mt-4" onclick="doReg()">Daftar akun</button>`;
else body=`<p class="text-sm text-gray-600 mb-3">Masukkan kode dari pendaftaran untuk mengaktifkan akun. Kosongkan kode untuk mengecek status saja.</p><label class="block text-sm font-medium">Nama pengguna<input id="vu" class="inp"></label><label class="block text-sm font-medium mt-3">Kode verifikasi<input id="vk" class="inp" inputmode="numeric"></label><button class="btn w-full mt-4" onclick="doVer()">Verifikasi akun</button>`;
$('#app').innerHTML=`<div class="pat min-h-screen flex items-center justify-center p-4"><div class="card w-full max-w-md p-6 pg" style="border-top:4px solid var(--gold)"><div class="text-center mb-5"><div class="mx-auto w-14 h-14 rounded-full grid place-items-center text-2xl" style="background:var(--g);box-shadow:0 0 0 3px #fff,0 0 0 5px var(--gold)">🕌</div><h1 class="text-3xl mt-3" style="color:var(--gd)">AdminEdu</h1><p class="text-sm text-gray-600">Administrasi pendidikan madrasah</p></div><div class="grid grid-cols-4 gap-1 bg-emerald-50 p-1 rounded-lg mb-4 text-sm">${T.map(([k,l])=>`<button onclick="tab='${k}';authView()" class="py-1.5 rounded-md font-semibold transition ${tab==k?'bg-white shadow text-emerald-800':'text-emerald-700'}">${l}</button>`).join('')}</div>${body}<p id="msg" class="text-sm mt-3"></p></div></div>`}
async function doLogin(r){const u=$('#lu').value.trim(),p=$('#lp').value,ph=await H(u,p),x=db.users.find(a=>a.u==u&&a.role==r&&(a.h?a.p==ph:a.p==p));
if(!x)return setMsg('Nama pengguna, kata sandi, atau jenis akun tidak cocok.');
if(x.status!='aktif')return setMsg('Akun masih menunggu verifikasi. Buka tab Verifikasi dan masukkan kode Anda.');
if(!x.h){x.p=ph;x.h=1;save()}me=x;pj=null;et=null;shell();go('home')}
async function doReg(){const n=$('#rn').value.trim(),u=$('#ru').value.trim(),p=$('#rp').value;
if(!n||!u||p.length<6)return setMsg('Lengkapi nama, nama pengguna, dan kata sandi minimal 6 karakter.');
if(db.users.some(a=>a.u==u))return setMsg('Nama pengguna sudah dipakai. Pilih nama lain.');
const k=String(100000+Math.floor(Math.random()*900000));
db.users.push({u,p:await H(u,p),h:1,nama:n,role:'guru',status:'pending',k:db.set.kode?k:''});save();
setMsg(db.set.kode?`Pendaftaran berhasil. Kode verifikasi Anda: <b>${k}</b>. Masukkan di tab Verifikasi untuk mengaktifkan akun.`:'Pendaftaran berhasil. Akun akan diaktifkan oleh admin. Cek statusnya di tab Verifikasi.',1)}
function doVer(){const u=$('#vu').value.trim(),k=$('#vk').value.trim(),x=db.users.find(a=>a.u==u);
if(!x)return setMsg('Nama pengguna tidak ditemukan.');
if(x.status=='aktif')return setMsg('Akun ini sudah aktif. Silakan masuk.',1);
if(!k)return setMsg('Status akun: menunggu verifikasi.');if(!db.set.kode)return setMsg('Verifikasi dengan kode sedang dinonaktifkan. Hubungi admin untuk mengaktifkan akun Anda.');
if(k!=x.k)return setMsg('Kode verifikasi salah.');
x.status='aktif';save();setMsg('Akun berhasil diaktifkan. Silakan masuk.',1)}

/* ---------- SHELL ---------- */
function shell(){const M=MENU.filter(m=>!m[3]||me.role=='admin');
$('#app').innerHTML=`<div class="md:flex min-h-screen"><aside id="sb" class="fixed md:sticky top-0 z-30 h-screen w-64 shrink-0 overflow-y-auto text-white transition-transform -translate-x-full md:translate-x-0" style="background:var(--gd)"><div class="p-4 flex items-center gap-2 border-b border-white/10"><span class="text-2xl">🕌</span><b class="ser text-xl" style="color:#f3d97a">AdminEdu</b></div><nav class="p-2 space-y-1">${M.map(m=>`<button id="m_${m[0]}" onclick="go('${m[0]}')" class="nv w-full text-left px-3 py-2 rounded-lg hover:bg-white/10 transition">${m[1]} ${m[2]}</button>`).join('')}</nav></aside><div class="flex-1 min-w-0"><header class="np bg-white border-b px-4 py-3 flex items-center gap-3"><button class="md:hidden text-2xl" aria-label="Menu" onclick="$('#sb').classList.toggle('-translate-x-full')">☰</button><button id="fbs" class="ml-auto text-xs np" onclick="fbPull(true)" title="Klik untuk sinkron sekarang"></button><div class="text-sm text-right"><b>${esc(me.nama)}</b><div class="text-gray-500">${me.role=='admin'?'Admin':'Guru'}</div></div><button class="btn2" onclick="me=null;authView()">Keluar</button></header><main id="main" class="p-4 md:p-6 max-w-6xl"></main></div></div>`}
function go(p){page=p;fbStatus(fbSt);$('#sb').classList.add('-translate-x-full');document.querySelectorAll('.nv').forEach(b=>b.classList.toggle('on',b.id=='m_'+p));
$('#main').innerHTML='<div class="pg">'+(V[p]?V[p]():crud(p))+'</div>'}

/* ---------- CRUD ---------- */
function crud(k){const d=DEFS[k],r=ed[k]!=null?db[k][ed[k]]:{},e=ed[k]!=null;
return `<h2 class="text-2xl mb-4" style="color:var(--gd)">${d.t}</h2><div class="card p-4 mb-4 np"><div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-3">${d.f.map(f=>fld(f,r[f[0]])).join('')}</div><div class="mt-3 flex gap-2"><button class="btn" onclick="saveRow('${k}')">${e?'Simpan perubahan':'Tambah data'}</button>${e?`<button class="btn2" onclick="ed.${k}=null;go('${k}')">Batal</button>`:''}${EX()}</div></div><div class="card overflow-x-auto"><table class="w-full text-sm"><thead class="bg-emerald-50 text-emerald-900"><tr><th class="p-2 text-left">No</th>${d.f.map((f,x)=>(x==d.f.findIndex(g=>g[2]=='multi')?'<th class="p-2 text-left">Ke-</th>':'')+`<th class="p-2 text-left whitespace-nowrap">${f[1]}</th>`).join('')}<th class="np"></th></tr></thead><tbody>${rowsHTML(k)||`<tr><td colspan="20" class="p-6 text-center text-gray-500">Belum ada data. Isi formulir di atas, lalu pilih Tambah data.</td></tr>`}</tbody></table></div>`}
function rowsHTML(k){const d=DEFS[k],mi=d.f.findIndex(g=>g[2]=='multi');
return db[k].map((r,i)=>{const L=d.f.map(f=>f[2]=='multi'?String(r[f[0]]||'').split('; ').filter(Boolean):null),n=Math.max(1,...L.filter(Boolean).map(a=>a.length)),
act=`<td rowspan="${n}" class="p-2 whitespace-nowrap np align-top"><button class="text-emerald-700 font-semibold mr-2" onclick="ed.${k}=${i};go('${k}');scrollTo(0,0)">Ubah</button><button class="text-red-600 font-semibold" onclick="delRow('${k}',${i})">Hapus</button></td>`;let h='';
for(let j=0;j<n;j++){h+=`<tr class="${j?'border-t border-dashed border-gray-200':(mi<0?'border-t':'border-t-2 border-emerald-200')}">`+(j?'':`<td rowspan="${n}" class="p-2 align-top">${i+1}</td>`)+d.f.map((f,x)=>(x==mi?`<td class="p-2 text-gray-500">${j+1}</td>`:'')+(L[x]?`<td class="p-2">${esc(L[x][j]||'')}</td>`:(j?'':`<td rowspan="${n}" class="p-2 align-top">${esc(r[f[0]])}</td>`))).join('')+(j?'':act)+'</tr>'}return h}).join('')}
function saveRow(k){const d=DEFS[k],o={};d.f.forEach(f=>{if(f[2]=='multi')addChip(f[0])});d.f.forEach(f=>o[f[0]]=val(f[0]).trim());
if(d.req&&!o[d.req])return toast('Lengkapi data wajib terlebih dahulu.');
if(ed[k]!=null)db[k][ed[k]]=o;else db[k].push(o);ed[k]=null;save();toast('Data tersimpan');go(k)}
function delRow(k,i){if(!confirm('Hapus data ini?'))return;db[k].splice(i,1);ed[k]=null;save();toast('Data dihapus');go(k)}

/* ---------- ABSENSI ---------- */
function tally(ta,kelas,ym){const r={};Object.entries(db.absen).forEach(([key,v])=>{const[t,kl,a]=key.split('|');if(kl!=kelas||a!=ta||t.slice(0,7)!=ym)return;
Object.entries(v).forEach(([n,s])=>{(r[n]=r[n]||{Hadir:0,Sakit:0,Izin:0,Alpa:0})[s]++})});return r}
function setAb(k,v){ab[k]=v;go('absen')}
function allHadir(){document.querySelectorAll('input[value=Hadir]').forEach(i=>i.checked=true)}
function saveAbsen(){const key=ab.tgl+'|'+ab.kelas+'|'+ab.ta,o={};
db.siswa.filter(s=>s.ta==ab.ta&&s.kelas==ab.kelas).forEach((s,i)=>{const c=document.querySelector(`input[name=s${i}]:checked`);o[s.nisn||s.nama]=c?c.value:'Hadir'});
db.absen[key]=o;save();toast('Absensi tersimpan');go('absen')}
function setRk(k,v){rk[k]=v;go('rekap')}

/* ---------- VIEWS ---------- */
const V={
home(){const t=new Date().toLocaleDateString('sv');let h=0,n=0;
Object.entries(db.absen).forEach(([k,v])=>{if(k.startsWith(t))Object.values(v).forEach(s=>{n++;if(s=='Hadir')h++})});
const C=[['🎓','Total Siswa',db.siswa.length],['👩‍🏫','Total Guru',db.users.filter(u=>u.role=='guru'&&u.status=='aktif').length],['✅','Kehadiran Hari Ini',n?h+' dari '+n+' siswa':'Belum diisi']];

function fbQueue(){if(!fbOn())return;clearTimeout(fbTimer);fbTimer=setTimeout(()=>{fbTimer=null;if(fbBusy)fbQueue();else fbPushNow()},1200)}
async function fbPushNow(){fbBusy=true;fbStatus('sync');const{kop,...rest}=db;
try{const k=JSON.stringify(kop);if(k!=fbKop){await fbPut('kop',kop);fbKop=k}fbT=await fbPut('main',rest,fbT);fbStatus('ok');fbBusy=false}
catch(e){fbBusy=false;if(e.conflict){toast('Ada perubahan baru dari perangkat lain. Data dimuat ulang; ulangi perubahan terakhir Anda.');fbT='';await fbPull(true,1)}else fbStatus('err')}}
async function fbPull(silent,force){if(!fbOn()||fbBusy||(fbTimer&&!force))return;fbBusy=true;
try{const[m,k]=await Promise.all([fbGet('main'),fbGet('kop')]);
if(!m){fbBusy=false;return fbPushNow()}
if(m.t!=fbT){const kop=k?k.v:db.kop;db=m.v;db.kop=kop;fbT=m.t;fbKop=JSON.stringify(kop);local();load();
if(me){me=db.users.find(u=>u.u==me.u&&u.status=='aktif');if(!me){fbBusy=false;authView();return}}
if(silent&&me&&!/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||''))go(page)}
fbStatus('ok')}catch(e){fbStatus('err')}fbBusy=false}
(async()=>{load();if(fbOn()){$('#app').innerHTML='<div class="min-h-screen grid place-items-center text-emerald-800">Memuat data dari server…</div>';await fbPull()}else fbStatus('off');authView();setInterval(()=>{if(me)fbPull(true)},25000)})();
</script></body></html>
