<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AdminEdu</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--g:#047857;--gd:#064e3b;--gold:#c9a227;--bg:#f6f4ec;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:#1f2937}
h1,h2,h3,.ser{font-family:Lora,Georgia,serif}
.inp{width:100%;border:1px solid #d6d3c4;border-radius:8px;padding:.5rem .7rem;background:#fff;font-weight:400}
label .inp{margin-top:.25rem}
.inp:focus,button:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.btn{background:var(--g);color:#fff;border-radius:8px;padding:.5rem 1rem;font-weight:600;transition:background .2s}
.btn:hover{background:var(--gd)}
.btn2{background:#fff;border:1px solid var(--g);color:var(--g);border-radius:8px;padding:.45rem .9rem;font-weight:600;transition:background .2s}
.btn2:hover{background:#ecfdf5}
.card{background:#fff;border-radius:14px;border:1px solid #e7e3d0}
.pat{background-color:#064e3b;background-image:linear-gradient(45deg,rgba(201,162,39,.14) 25%,transparent 25%,transparent 75%,rgba(201,162,39,.14) 75%),linear-gradient(45deg,rgba(201,162,39,.14) 25%,transparent 25%,transparent 75%,rgba(201,162,39,.14) 75%);background-size:56px 56px;background-position:0 0,28px 28px}
.nv.on{background:rgba(201,162,39,.25);color:#f3d97a}
@keyframes pg{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.pg{animation:pg .3s ease}
@media(prefers-reduced-motion:reduce){.pg{animation:none}}
.doc table{border-collapse:collapse;width:100%}.doc .dt td,.doc .dt th{border:1px solid #000;padding:4px 6px;text-align:left}
@media print{aside,header,.np{display:none!important}main{padding:0!important}body.pv #app{display:none!important}#pv{position:static!important;background:none!important;padding:0!important}}
</style></head>
<body><div id="app"></div>
<div id="toast" class="fixed bottom-4 left-1/2 -translate-x-1/2 bg-emerald-900 text-white px-4 py-2 rounded-lg shadow-lg text-sm opacity-0 pointer-events-none transition-opacity z-50"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TA='2026/2027',KLS=[1,2,3,4,5,6].map(n=>'Kelas '+n),HARI=['Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'],ST=['Hadir','Sakit','Izin','Alpa'];
const BLN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const MENU=[['home','🏠','Beranda'],['bio','👤','Biodata Guru'],['nilai','📖','Nilai-Nilai Dasar'],['siswa','🎓','Data Diri Siswa',1],['ortu','👪','Data Orang Tua',1],['jadwal','🗓️','Jadwal Pelajaran'],['piket','🧹','Jadwal Piket'],['absen','✅','Daftar Hadir'],['rekap','📊','Rekap Absen'],['proyek','📁','Proyek Saya'],['kop','🏛️','Kop & Tanda Tangan',1],['bak','💾','Cadangan Data',1],['user','🔑','Kelola Akun',1],['akun','⚙️','Pengaturan Akun']];
const DEFS={
siswa:{t:'Data Diri Siswa',req:'nama',f:[['ta','Tahun Ajaran','ta'],['kelas','Kelas','kelas'],['nisn','NISN'],['nama','Nama Siswa'],['jk','Jenis Kelamin','sel',['Laki-laki','Perempuan']],['ttl','Tempat, Tanggal Lahir']]},
ortu:{t:'Data Orang Tua Siswa',req:'nama',f:[['ta','Tahun Ajaran','ta'],['kelas','Kelas','kelas'],['nama','Nama Siswa','sis'],['ayah','Nama Ayah'],['ibu','Nama Ibu'],['hp','Kontak HP'],['alamat','Alamat']]},
jadwal:{t:'Jadwal Mata Pelajaran',f:[['ta','Tahun Ajaran','ta'],['kelas','Kelas','kelas'],...HARI.map(h=>[h,h])]},
piket:{t:'Jadwal Piket Kelas',f:[['ta','Tahun Ajaran','ta'],['kelas','Kelas','kelas'],...HARI.map(h=>[h,h])]}};
const BIO=[['nama','Nama Lengkap'],['nip','NIP'],['nuptk','NUPTK'],['ttl','Tempat, Tanggal Lahir'],['pend','Pendidikan Terakhir'],['jab','Jabatan Guru'],['gol','Pangkat/Golongan'],['kelas','Tugas Mengajar Kelas']];
const NILAI=[['Pancasila','1. Ketuhanan Yang Maha Esa.\n2. Kemanusiaan yang adil dan beradab.\n3. Persatuan Indonesia.\n4. Kerakyatan yang dipimpin oleh hikmat kebijaksanaan dalam permusyawaratan/perwakilan.\n5. Keadilan sosial bagi seluruh rakyat Indonesia.'],
['Kode Etik Guru','Guru beriman dan bertakwa, serta menjadi teladan akhlak bagi peserta didik.\nGuru bersikap adil, jujur, dan tidak diskriminatif kepada seluruh peserta didik.\nGuru menjaga kerahasiaan data pribadi peserta didik dan sejawat.\nGuru terus meningkatkan kompetensi profesional dan pedagogik.\nGuru menjalin kerja sama yang baik dengan orang tua, rekan kerja, dan masyarakat.'],
['Ikrar Guru','Kami guru madrasah berikrar:\nSetia mengabdi kepada agama, bangsa, dan negara.\nMendidik dengan ikhlas, sabar, dan penuh kasih sayang.\nMenjunjung tinggi martabat profesi guru.\nMengutamakan kepentingan peserta didik di atas kepentingan pribadi.'],
['Tata Tertib Guru','Hadir 15 menit sebelum jam pelajaran pertama dimulai.\nBerpakaian rapi, sopan, dan sesuai ketentuan madrasah.\nMengisi jurnal mengajar dan daftar hadir siswa setiap hari.\nMemberi tahu madrasah lebih dulu jika berhalangan hadir.\nMenjaga kebersihan, ketertiban, dan sarana madrasah.']];
let db,me=null,page='home',tab='admin',ed={},ab={ta:TA,kelas:KLS[0],tgl:new Date().toLocaleDateString('sv')},rk={ta:TA,kelas:KLS[0],sem:'Ganjil'};
const SEED={users:[{u:'admin',p:'admin123',nama:'Administrator',role:'admin',status:'aktif'},{u:'guru',p:'guru123',nama:'Ustadz Ahmad',role:'guru',status:'aktif'}],
siswa:[['1234567001','Aisyah Nur Hidayah','Perempuan','Makassar, 12 Mei 2019'],['1234567002','Muhammad Faris','Laki-laki','Gowa, 3 Februari 2019'],['1234567003','Siti Khadijah','Perempuan','Maros, 21 Agustus 2019'],['1234567004','Umar Abdullah','Laki-laki','Makassar, 9 Januari 2019']].map(a=>({ta:TA,kelas:'Kelas 1',nisn:a[0],nama:a[1],jk:a[2],ttl:a[3]})),
ortu:[],jadwal:[],piket:[],absen:{},guru:{},info:['Pembagian jadwal semester ganjil sudah tersedia di menu Jadwal Pelajaran.','Guru wajib mengisi daftar hadir siswa sebelum jam kedua.']};
function load(){try{db=JSON.parse(localStorage.getItem('adminedu'))}catch(e){db=null}if(!db)db=JSON.parse(JSON.stringify(SEED));db.proyek=db.proyek||[];db.set=Object.assign({kode:true},db.set||{});db.kop=Object.assign({kem:'KEMENTERIAN AGAMA REPUBLIK INDONESIA',nama:'NAMA MADRASAH',alamat:'Alamat madrasah',kontak:'Telepon / email',kota:'Makassar',kepala:'',nipk:'',wali:'',nipw:'',logo:''},db.kop||{})}
function save(){try{localStorage.setItem('adminedu',JSON.stringify(db))}catch(e){}}
function toast(m){const t=$('#toast');t.textContent=m;t.style.opacity=1;clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.opacity=0,2200)}
function setMsg(t,ok){const m=$('#msg');m.className='text-sm mt-3 '+(ok?'text-emerald-700':'text-red-600');m.innerHTML=t}
const sel=(k,a,v)=>`<select id="f_${k}" class="inp">${a.map(x=>`<option ${x==v?'selected':''}>${esc(x)}</option>`).join('')}</select>`;
function fld(f,v){const[k,l,t,o]=f;let i;
if(t=='kelas')i=sel(k,KLS,v);else if(t=='sel')i=sel(k,o,v);else if(t=='sis')i=sel(k,db.siswa.map(s=>s.nama),v);
else i=`<input id="f_${k}" class="inp" value="${esc(v||(t=='ta'?TA:''))}">`;
return `<label class="block text-sm font-medium">${l}${i}</label>`}
const val=k=>($('#f_'+k)||{}).value||'';

/* ---------- AUTH ---------- */
function authView(){
const T=[['admin','Admin'],['guru','Guru'],['daftar','Daftar'],['verif','Verifikasi']];
let body='';
if(tab=='admin'||tab=='guru')body=`<label class="block text-sm font-medium">Nama pengguna<input id="lu" class="inp" autocomplete="username"></label><label class="block text-sm font-medium mt-3">Kata sandi<input id="lp" type="password" class="inp" autocomplete="current-password"></label><button class="btn w-full mt-4" onclick="doLogin('${tab}')">Masuk sebagai ${tab=='admin'?'Admin':'Guru'}</button>`;
else if(tab=='daftar')body=`<div class="space-y-3"><label class="block text-sm font-medium">Nama lengkap<input id="rn" class="inp"></label><label class="block text-sm font-medium">Nama pengguna<input id="ru" class="inp"></label><label class="block text-sm font-medium">Kata sandi (min. 6 karakter)<input id="rp" type="password" class="inp"></label><p class="text-xs text-gray-500">Pendaftaran baru berlaku sebagai akun Guru. Akun admin hanya dibuat oleh admin.</p></div><button class="btn w-full mt-4" onclick="doReg()">Daftar akun</button>`;
else body=`<p class="text-sm text-gray-600 mb-3">Masukkan kode dari pendaftaran untuk mengaktifkan akun. Kosongkan kode untuk mengecek status saja.</p><label class="block text-sm font-medium">Nama pengguna<input id="vu" class="inp"></label><label class="block text-sm font-medium mt-3">Kode verifikasi<input id="vk" class="inp" inputmode="numeric"></label><button class="btn w-full mt-4" onclick="doVer()">Verifikasi akun</button>`;
$('#app').innerHTML=`<div class="pat min-h-screen flex items-center justify-center p-4"><div class="card w-full max-w-md p-6 pg" style="border-top:4px solid var(--gold)"><div class="text-center mb-5"><div class="mx-auto w-14 h-14 rounded-full grid place-items-center text-2xl" style="background:var(--g);box-shadow:0 0 0 3px #fff,0 0 0 5px var(--gold)">🕌</div><h1 class="text-3xl mt-3" style="color:var(--gd)">AdminEdu</h1><p class="text-sm text-gray-600">Administrasi pendidikan madrasah</p></div><div class="grid grid-cols-4 gap-1 bg-emerald-50 p-1 rounded-lg mb-4 text-sm">${T.map(([k,l])=>`<button onclick="tab='${k}';authView()" class="py-1.5 rounded-md font-semibold transition ${tab==k?'bg-white shadow text-emerald-800':'text-emerald-700'}">${l}</button>`).join('')}</div>${body}<p id="msg" class="text-sm mt-3"></p></div></div>`}
function doLogin(r){const u=$('#lu').value.trim(),p=$('#lp').value,x=db.users.find(a=>a.u==u&&a.p==p&&a.role==r);
if(!x)return setMsg('Nama pengguna, kata sandi, atau jenis akun tidak cocok.');
if(x.status!='aktif')return setMsg('Akun masih menunggu verifikasi. Buka tab Verifikasi dan masukkan kode Anda.');
me=x;pj=null;et=null;shell();go('home')}
function doReg(){const n=$('#rn').value.trim(),u=$('#ru').value.trim(),p=$('#rp').value;
if(!n||!u||p.length<6)return setMsg('Lengkapi nama, nama pengguna, dan kata sandi minimal 6 karakter.');
if(db.users.some(a=>a.u==u))return setMsg('Nama pengguna sudah dipakai. Pilih nama lain.');
const k=String(100000+Math.floor(Math.random()*900000));
db.users.push({u,p,nama:n,role:'guru',status:'pending',k:db.set.kode?k:''});save();
setMsg(db.set.kode?`Pendaftaran berhasil. Kode verifikasi Anda: <b>${k}</b>. Masukkan di tab Verifikasi untuk mengaktifkan akun.`:'Pendaftaran berhasil. Akun akan diaktifkan oleh admin. Cek statusnya di tab Verifikasi.',1)}
function doVer(){const u=$('#vu').value.trim(),k=$('#vk').value.trim(),x=db.users.find(a=>a.u==u);
if(!x)return setMsg('Nama pengguna tidak ditemukan.');
if(x.status=='aktif')return setMsg('Akun ini sudah aktif. Silakan masuk.',1);
if(!k)return setMsg('Status akun: menunggu verifikasi.');if(!db.set.kode)return setMsg('Verifikasi dengan kode sedang dinonaktifkan. Hubungi admin untuk mengaktifkan akun Anda.');
if(k!=x.k)return setMsg('Kode verifikasi salah.');
x.status='aktif';save();setMsg('Akun berhasil diaktifkan. Silakan masuk.',1)}

/* ---------- SHELL ---------- */
function shell(){const M=MENU.filter(m=>!m[3]||me.role=='admin');
$('#app').innerHTML=`<div class="md:flex min-h-screen"><aside id="sb" class="fixed md:sticky top-0 z-30 h-screen w-64 shrink-0 overflow-y-auto text-white transition-transform -translate-x-full md:translate-x-0" style="background:var(--gd)"><div class="p-4 flex items-center gap-2 border-b border-white/10"><span class="text-2xl">🕌</span><b class="ser text-xl" style="color:#f3d97a">AdminEdu</b></div><nav class="p-2 space-y-1">${M.map(m=>`<button id="m_${m[0]}" onclick="go('${m[0]}')" class="nv w-full text-left px-3 py-2 rounded-lg hover:bg-white/10 transition">${m[1]} ${m[2]}</button>`).join('')}</nav></aside><div class="flex-1 min-w-0"><header class="np bg-white border-b px-4 py-3 flex items-center gap-3"><button class="md:hidden text-2xl" aria-label="Menu" onclick="$('#sb').classList.toggle('-translate-x-full')">☰</button><div class="ml-auto text-sm text-right"><b>${esc(me.nama)}</b><div class="text-gray-500">${me.role=='admin'?'Admin':'Guru'}</div></div><button class="btn2" onclick="me=null;authView()">Keluar</button></header><main id="main" class="p-4 md:p-6 max-w-6xl"></main></div></div>`}
function go(p){page=p;$('#sb').classList.add('-translate-x-full');document.querySelectorAll('.nv').forEach(b=>b.classList.toggle('on',b.id=='m_'+p));
$('#main').innerHTML='<div class="pg">'+(V[p]?V[p]():crud(p))+'</div>'}

/* ---------- CRUD ---------- */
function crud(k){const d=DEFS[k],r=ed[k]!=null?db[k][ed[k]]:{},e=ed[k]!=null;
return `<h2 class="text-2xl mb-4" style="color:var(--gd)">${d.t}</h2><div class="card p-4 mb-4 np"><div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-3">${d.f.map(f=>fld(f,r[f[0]])).join('')}</div><div class="mt-3 flex gap-2"><button class="btn" onclick="saveRow('${k}')">${e?'Simpan perubahan':'Tambah data'}</button>${e?`<button class="btn2" onclick="ed.${k}=null;go('${k}')">Batal</button>`:''}${EX()}</div></div><div class="card overflow-x-auto"><table class="w-full text-sm"><thead class="bg-emerald-50 text-emerald-900"><tr><th class="p-2 text-left">No</th>${d.f.map(f=>`<th class="p-2 text-left whitespace-nowrap">${f[1]}</th>`).join('')}<th class="np"></th></tr></thead><tbody>${db[k].map((r,i)=>`<tr class="border-t"><td class="p-2">${i+1}</td>${d.f.map(f=>`<td class="p-2">${esc(r[f[0]])}</td>`).join('')}<td class="p-2 whitespace-nowrap np"><button class="text-emerald-700 font-semibold mr-2" onclick="ed.${k}=${i};go('${k}');scrollTo(0,0)">Ubah</button><button class="text-red-600 font-semibold" onclick="delRow('${k}',${i})">Hapus</button></td></tr>`).join('')||`<tr><td colspan="20" class="p-6 text-center text-gray-500">Belum ada data. Isi formulir di atas, lalu pilih Tambah data.</td></tr>`}</tbody></table></div>`}
function saveRow(k){const d=DEFS[k],o={};d.f.forEach(f=>o[f[0]]=val(f[0]).trim());
if(d.req&&!o[d.req])return toast('Lengkapi data wajib terlebih dahulu.');
if(ed[k]!=null)db[k][ed[k]]=o;else db[k].push(o);ed[k]=null;save();toast('Data tersimpan');go(k)}
function delRow(k,i){if(!confirm('Hapus data ini?'))return;db[k].splice(i,1);ed[k]=null;save();toast('Data dihapus');go(k)}

/* ---------- ABSENSI ---------- */
function tally(ta,kelas,ym){const r={};Object.entries(db.absen).forEach(([key,v])=>{const[t,kl,a]=key.split('|');if(kl!=kelas||a!=ta||t.slice(0,7)!=ym)return;
Object.entries(v).forEach(([n,s])=>{(r[n]=r[n]||{Hadir:0,Sakit:0,Izin:0,Alpa:0})[s]++})});return r}
function setAb(k,v){ab[k]=v;go('absen')}
function allHadir(){document.querySelectorAll('input[value=Hadir]').forEach(i=>i.checked=true)}
function saveAbsen(){const key=ab.tgl+'|'+ab.kelas+'|'+ab.ta,o={};
db.siswa.filter(s=>s.ta==ab.ta&&s.kelas==ab.kelas).forEach((s,i)=>{const c=document.querySelector(`input[name=s${i}]:checked`);o[s.nisn||s.nama]=c?c.value:'Hadir'});
db.absen[key]=o;save();toast('Absensi tersimpan');go('absen')}
function setRk(k,v){rk[k]=v;go('rekap')}

/* ---------- VIEWS ---------- */
const V={
home(){const t=new Date().toLocaleDateString('sv');let h=0,n=0;
Object.entries(db.absen).forEach(([k,v])=>{if(k.startsWith(t))Object.values(v).forEach(s=>{n++;if(s=='Hadir')h++})});
const C=[['🎓','Total Siswa',db.siswa.length],['👩‍🏫','Total Guru',db.users.filter(u=>u.role=='guru'&&u.status=='aktif').length],['✅','Kehadiran Hari Ini',n?h+' dari '+n+' siswa':'Belum diisi']];
return `<h2 class="text-2xl" style="color:var(--gd)">Selamat datang, ${esc(me.nama)}</h2><p class="text-gray-600 mb-4">${new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</p><div class="grid sm:grid-cols-3 gap-4 mb-4">${C.map(c=>`<div class="card p-4" style="border-left:4px solid var(--gold)"><div class="text-2xl">${c[0]}</div><div class="text-sm text-gray-500 mt-1">${c[1]}</div><div class="ser text-2xl" style="color:var(--g)">${c[2]}</div></div>`).join('')}</div>${me.role=='admin'&&!db.lastBak?`<div class="card p-3 mb-4 text-sm" style="background:#fbf5dc;border-color:var(--gold)">Data belum pernah dicadangkan. Buka menu Cadangan Data lalu unduh cadangan.</div>`:''}<div class="card p-4"><h3 class="text-lg mb-2" style="color:var(--gd)">Pengumuman penting</h3><ul class="space-y-2">${db.info.map((x,i)=>`<li class="flex gap-2 text-sm"><span>📌</span><span class="flex-1">${esc(x)}</span>${me.role=='admin'?`<button class="text-red-600" onclick="db.info.splice(${i},1);save();go('home')">Hapus</button>`:''}</li>`).join('')||'<li class="text-sm text-gray-500">Belum ada pengumuman.</li>'}</ul>${me.role=='admin'?`<div class="flex gap-2 mt-3"><input id="f_ni" class="inp" placeholder="Tulis pengumuman baru"><button class="btn" onclick="const v=val('ni').trim();if(v){db.info.unshift(v);save();go('home')}">Tambah</button></div>`:''}</div>`},
bio(){const r=db.guru[me.u]||{nama:me.nama};
return `<h2 class="text-2xl mb-4" style="color:var(--gd)">Biodata Guru / Wali Kelas</h2><div class="card p-4"><div class="grid sm:grid-cols-2 gap-3">${BIO.map(f=>fld(f,r[f[0]])).join('')}</div><div class="mt-3 flex gap-2 np"><button class="btn" onclick="db.guru[me.u]=Object.fromEntries(BIO.map(f=>[f[0],val(f[0]).trim()]));save();toast('Biodata tersimpan')">Simpan biodata</button>${EX()}</div></div>`},
nilai(){return `<h2 class="text-2xl mb-4" style="color:var(--gd)">Nilai-Nilai Dasar</h2><div class="space-y-3">${NILAI.map((n,i)=>`<details class="card p-4" ${i?'':'open'}><summary class="ser text-lg cursor-pointer" style="color:var(--g)">${n[0]}</summary><div class="mt-2 space-y-1 text-sm leading-relaxed">${n[1].split('\n').map(l=>`<p>${esc(l)}</p>`).join('')}</div></details>`).join('')}</div>`},
absen(){const list=db.siswa.filter(s=>s.ta==ab.ta&&s.kelas==ab.kelas),cur=db.absen[ab.tgl+'|'+ab.kelas+'|'+ab.ta]||{},ym=ab.tgl.slice(0,7),tl=tally(ab.ta,ab.kelas,ym),bl=BLN[+ym.slice(5)-1];

/* ---------- KOP & EKSPOR ---------- */
const TG=()=>new Date().toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'});
const KF=[['kem','Instansi induk'],['nama','Nama madrasah'],['alamat','Alamat'],['kontak','Telepon / email / situs'],['kota','Kota penandatangan'],['kepala','Nama kepala madrasah'],['nipk','NIP kepala madrasah'],['wali','Nama guru / wali kelas'],['nipw','NIP guru / wali kelas']];
const EX=()=>`<span class="ml-auto flex gap-2 flex-wrap np"><button class="btn2" onclick="pv()">Cetak</button><button class="btn2" onclick="ex('pdf')">PDF</button><button class="btn2" onclick="ex('docx')">Word</button><button class="btn2" onclick="ex('xlsx')">Excel</button></span>`;
function readKop(){KF.forEach(f=>db.kop[f[0]]=val(f[0]).trim())}
function setLogo(inp){const f=inp.files[0];if(!f)return;readKop();const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,240/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);db.kop.logo=c.toDataURL('image/png');save();go('kop')};im.src=r.result};r.readAsDataURL(f)}
const imgDim=s=>new Promise(r=>{const i=new Image();i.onload=()=>r({width:i.width,height:i.height});i.src=s});
function model(){
if(DEFS[page]){const d=DEFS[page];return{title:d.t.toUpperCase(),head:['No',...d.f.map(f=>f[1])],rows:db[page].map((r,i)=>[i+1,...d.f.map(f=>r[f[0]]||'')])}}
if(page=='bio'){const r=db.guru[me.u]||{};return{title:'BIODATA GURU / WALI KELAS',head:['No','Data','Keterangan'],rows:BIO.map((f,i)=>[i+1,f[1],r[f[0]]||'-'])}}
if(page=='absen'){const cur=db.absen[ab.tgl+'|'+ab.kelas+'|'+ab.ta]||{};
return{title:'DAFTAR HADIR SISWA',sub:`Kelas: ${ab.kelas}  |  Tahun Ajaran: ${ab.ta}  |  Tanggal: ${new Date(ab.tgl+'T00:00').toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'})}`,head:['No','NISN','Nama Siswa','Status'],
rows:db.siswa.filter(s=>s.ta==ab.ta&&s.kelas==ab.kelas).map((s,i)=>{const c=document.querySelector(`input[name=s${i}]:checked`);return[i+1,s.nisn,s.nama,c?c.value:(cur[s.nisn||s.nama]||'Hadir')]})}}
if(page=='rekap'){const y=+rk.ta.split('/')[0]||2026,ms=rk.sem=='Ganjil'?[7,8,9,10,11,12].map(m=>[y,m]):[1,2,3,4,5,6].map(m=>[y+1,m]),T=[0,0,0,0];
const rows=ms.map(([yy,m])=>{const t=tally(rk.ta,rk.kelas,yy+'-'+String(m).padStart(2,'0')),c=[0,0,0,0];Object.values(t).forEach(o=>ST.forEach((s,i)=>c[i]+=o[s]));c.forEach((v,i)=>T[i]+=v);return[BLN[m-1]+' '+yy,...c,c.reduce((a,b)=>a+b,0)]});
rows.push(['Total semester '+rk.sem,...T,T.reduce((a,b)=>a+b,0)]);
return{title:'REKAP ABSEN SISWA',sub:`Kelas: ${rk.kelas}  |  Tahun Ajaran: ${rk.ta}  |  Semester ${rk.sem}`,head:['Bulan',...ST,'Total'],rows}}}
function docHTML(m){const k=db.kop,body=!m.head?'':`<h3 style="text-align:center;font-weight:bold;font-size:14px;margin:12px 0 2px;font-family:inherit">${esc(m.title)}</h3>${m.sub?`<p style="text-align:center;margin-bottom:8px">${esc(m.sub)}</p>`:''}<table class="dt" style="margin-top:8px"><thead><tr>${m.head.map(h=>`<th style="background:#047857;color:#fff">${esc(h)}</th>`).join('')}</tr></thead><tbody>${m.rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table><table style="margin-top:28px;text-align:center"><tr><td style="width:50%">Mengetahui,<br>Kepala Madrasah<br><br><br><br><b>${esc(k.kepala||'..............................')}</b><br>NIP. ${esc(k.nipk)}</td><td>${esc(k.kota)}, ${TG()}<br>Guru / Wali Kelas<br><br><br><br><b>${esc(k.wali||'..............................')}</b><br>NIP. ${esc(k.nipw)}</td></tr></table>`;
return `<div class="doc" style="font-family:'Times New Roman',Times,serif;color:#000;font-size:12px"><table style="border-bottom:3px double #000"><tr><td style="width:84px;padding-bottom:6px">${k.logo?`<img src="${k.logo}" alt="Logo" style="width:72px;height:72px;object-fit:contain">`:''}</td><td style="text-align:center;padding-bottom:6px"><div style="font-size:13px;font-weight:bold">${esc(k.kem)}</div><div style="font-size:17px;font-weight:bold">${esc(k.nama)}</div><div>${esc(k.alamat)}</div><div>${esc(k.kontak)}</div></td><td style="width:84px"></td></tr></table>${body}</div>`}
function pv(){const m=model();if(!m)return;document.body.classList.add('pv');const d=document.createElement('div');d.id='pv';d.className='fixed inset-0 z-40 overflow-auto bg-black/60 p-4';
d.innerHTML=`<div class="max-w-4xl mx-auto"><div class="np flex gap-2 mb-3 justify-end"><button class="btn" onclick="print()">Cetak sekarang</button><button class="btn2" onclick="closePv()">Tutup</button></div><div class="bg-white p-8 rounded shadow overflow-x-auto">${docHTML(m)}</div></div>`;document.body.appendChild(d)}
function closePv(){$('#pv').remove();document.body.classList.remove('pv')}
async function dl(name,data){const d=window.claude&&await claude.use('downloads');if(!d)return toast('Unduhan tidak tersedia di tampilan ini.');
try{await d.save({filename:name,data});toast('File disimpan');return 1}catch(e){if(e.code!='declined')toast('Gagal menyimpan file ('+(e.code||'error')+').')}}
async function ex(t){const m=model();if(!m)return;const k=db.kop,fn=page+'_'+new Date().toLocaleDateString('sv');
try{if(t=='pdf'){if(!window.jspdf)return toast('Pustaka PDF belum termuat.');await dl(fn+'.pdf',mkPdf(m))}
else if(t=='docx'){if(!window.JSZip)return toast('Pustaka Word belum termuat.');await dl(fn+'.docx',await mkDocx(m))}
else{if(!window.XLSX)return toast('Pustaka Excel belum termuat.');await dl(fn+'.xlsx',mkXlsx(m))}}catch(e){toast('Gagal membuat file.')}}
function mkPdf(m){const k=db.kop,d=new window.jspdf.jsPDF({orientation:m.head.length>6?'l':'p',unit:'mm',format:'a4'}),w=d.internal.pageSize.getWidth(),h=d.internal.pageSize.getHeight();
if(k.logo){const p=d.getImageProperties(k.logo),s=22/Math.max(p.width,p.height);d.addImage(k.logo,'PNG',14,10,p.width*s,p.height*s)}
d.setFont('helvetica','bold');d.setFontSize(11);d.text(k.kem,w/2,14,{align:'center'});d.setFontSize(15);d.text(k.nama,w/2,21,{align:'center'});
d.setFont('helvetica','normal');d.setFontSize(9);d.text(k.alamat,w/2,26,{align:'center'});d.text(k.kontak,w/2,30,{align:'center'});
d.setLineWidth(.8);d.line(14,35,w-14,35);d.setLineWidth(.2);d.line(14,36.2,w-14,36.2);
d.setFont('helvetica','bold');d.setFontSize(12);d.text(m.title,w/2,44,{align:'center'});let y=48;
if(m.sub){d.setFont('helvetica','normal');d.setFontSize(9);d.text(m.sub,w/2,50,{align:'center'});y=54}

let pj=null,et=null;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const cp=()=>db.proyek.find(x=>x.id==pj&&x.o==me.u);
function addPj(){const n=val('pn').trim();if(!n)return toast('Isi nama proyek terlebih dahulu.');db.proyek.push({id:uid(),o:me.u,nama:n,desk:val('pd').trim(),tugas:[]});save();toast('Proyek dibuat');go('proyek')}
function savePj(){const p=cp();p.nama=val('pn').trim()||p.nama;p.desk=val('pd').trim();save();toast('Proyek diperbarui');go('proyek')}
function delPj(){if(!confirm('Hapus proyek beserta semua tugasnya?'))return;db.proyek=db.proyek.filter(x=>x.id!=pj);pj=null;et=null;save();toast('Proyek dihapus');go('proyek')}
function saveTask(){const p=cp(),j=val('tj').trim();if(!j)return toast('Isi judul tugas terlebih dahulu.');const o={judul:j,tg:val('tt'),pr:val('tp'),s:val('ts'),cat:val('tc').trim()};
if(et)Object.assign(p.tugas.find(t=>t.id==et),o);else p.tugas.push({id:uid(),...o});et=null;save();toast('Tugas tersimpan');go('proyek')}
function setSt(id,v){cp().tugas.find(t=>t.id==id).s=v;save();go('proyek')}
function delTask(id){if(!confirm('Hapus tugas ini?'))return;const p=cp();p.tugas=p.tugas.filter(t=>t.id!=id);save();toast('Tugas dihapus');go('proyek')}

function restoreFile(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{let o;try{o=JSON.parse(r.result)}catch(e){}
if(!o||o.app!='AdminEdu'||!o.data||!Array.isArray(o.data.users)||!o.data.users.some(u=>u.role=='admin'))return toast('File bukan cadangan AdminEdu yang valid.');

db=o.data;save();load();me=db.users.find(u=>u.u==me.u&&u.status=='aktif');if(!me){authView();return}pj=null;et=null;shell();go('bak');toast('Data berhasil dipulihkan')};r.readAsText(f)}
